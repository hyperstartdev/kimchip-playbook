<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>KIMCHIP Playbook</title>
<meta name="description" content="KIMCHIP US 런칭 전략 & 성과 대시보드" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#15171c; --muted:#6b7280; --line:#e7e9ee;
    --brand:#e0392b; --brand-soft:#fdecea; --brand-ink:#b4271b;
    --green:#16a34a; --green-soft:#e7f6ed; --red:#dc2626; --red-soft:#fdeaea;
    --blue:#2563eb; --amber:#d97706; --violet:#7c3aed;
    --sidebar:#14161c; --sidebar-ink:#c7ccd6; --sidebar-active:#1f2230; --sidebar-muted:#7b8294;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}

  /* ---------- LOGIN ---------- */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 30% -10%,#fde3df 0%,transparent 55%),var(--bg);padding:24px}
  .login-card{width:380px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    box-shadow:0 10px 40px rgba(16,24,40,.10);padding:34px 30px}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo-badge{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:-.5px}
  .brand-name{font-weight:800;font-size:18px;letter-spacing:-.3px}
  .brand-x{color:var(--muted);font-weight:600}
  .login-card h1{font-size:20px;margin:18px 0 4px}
  .login-card p.sub{color:var(--muted);margin:0 0 22px;font-size:13px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px}
  .field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;background:#fbfbfc}
  .field input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
  .btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:14px;transition:.15s}
  .btn:hover{background:var(--brand-ink)}
  .login-hint{margin-top:16px;font-size:12px;color:var(--muted);text-align:center}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100%}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:248px;flex:0 0 248px;background:var(--sidebar);color:var(--sidebar-ink);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar::-webkit-scrollbar{width:8px}.sidebar::-webkit-scrollbar-thumb{background:#2a2e3a;border-radius:8px}
  .side-head{padding:18px 18px 12px;display:flex;align-items:center;gap:10px}
  .side-head .logo-badge{width:30px;height:30px;font-size:14px}
  .side-head .t{font-weight:800;color:#fff;font-size:15px;line-height:1.1}
  .side-head .t small{display:block;color:var(--sidebar-muted);font-weight:600;font-size:11px;margin-top:2px}
  .nav-group{padding:6px 10px}
  .nav-group .label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--sidebar-muted);
    padding:10px 10px 6px;font-weight:700}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--sidebar-ink);
    font-size:13.5px;font-weight:500;margin:1px 0}
  .nav-item:hover{background:#1b1e28;color:#fff}
  .nav-item.active{background:var(--sidebar-active);color:#fff;font-weight:600}
  .nav-item .ic{width:18px;text-align:center;opacity:.85;font-size:14px}
  .nav-item.active .ic{opacity:1}
  .side-foot{margin-top:auto;padding:14px;border-top:1px solid #23262f;display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:#3a3f4d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .side-foot .who{font-size:13px;color:#fff;font-weight:600}
  .side-foot .role{font-size:11px;color:var(--sidebar-muted)}
  .logout{margin-left:auto;color:var(--sidebar-muted);font-size:12px;background:none;border:none}
  .logout:hover{color:#fff}

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:60px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:14px;padding:0 26px;position:sticky;top:0;z-index:5}
  .topbar h2{font-size:16px;margin:0;font-weight:700}
  .crumb{color:var(--muted);font-size:13px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
  .pill.muted{background:#eef0f3;color:#4b5563}
  .content{padding:24px 26px 60px;max-width:1240px;width:100%}

  .page-head{margin-bottom:18px}
  .page-head h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
  .page-head p{margin:0;color:var(--muted);font-size:13.5px}

  /* cards & grids */
  .grid{display:grid;gap:16px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .cols-2{grid-template-columns:2fr 1fr}
  .cols-3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}.cols-2,.cols-3{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .card h3{margin:0 0 2px;font-size:14px}
  .card .csub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .kpi .k-label{color:var(--muted);font-size:12.5px;font-weight:600}
  .kpi .k-val{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:8px 0 4px}
  .delta{font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px}
  .delta.up{color:var(--green);background:var(--green-soft)}
  .delta.down{color:var(--red);background:var(--red-soft)}
  .chart-wrap{position:relative;height:280px}
  .chart-sm{height:220px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
  .tag.g{background:var(--green-soft);color:var(--green)}
  .tag.r{background:var(--red-soft);color:var(--red)}
  .tag.b{background:#e8f0fe;color:var(--blue)}
  .tag.a{background:#fef3e2;color:var(--amber)}
  .tag.v{background:#f1e9fd;color:var(--violet)}

  .list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .list-row:last-child{border-bottom:none}
  .bar{height:8px;border-radius:6px;background:#eef0f3;overflow:hidden;flex:1}
  .bar>span{display:block;height:100%;border-radius:6px;background:var(--brand)}

  .doc h4{font-size:14px;margin:18px 0 6px}
  .doc p{color:#374151;margin:0 0 10px}
  .doc ul{margin:0 0 12px;padding-left:18px;color:#374151}
  .doc li{margin:4px 0}
  .callout{border-left:3px solid var(--brand);background:var(--brand-soft);padding:12px 14px;border-radius:0 10px 10px 0;margin:12px 0;color:#7a1d14}
  .step{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:none}
  .step .n{flex:0 0 26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{font-size:12px;padding:5px 11px;border-radius:999px;background:#eef0f3;color:#374151;font-weight:600}
  .media{aspect-ratio:9/16;border-radius:12px;background:linear-gradient(135deg,#2b2f3a,#454b5c);position:relative;overflow:hidden;display:flex;align-items:flex-end;color:#fff}
  .media .meta{padding:10px;font-size:12px;width:100%;background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .media .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.85}
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:1080px){.gallery{grid-template-columns:repeat(2,1fr)}}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
  .section-title h2{font-size:16px;margin:0}
  .btn-sm{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:12.5px}
  .btn-sm.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .input-line{display:flex;gap:8px;margin-bottom:14px}
  .input-line input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;outline:none}
  .input-line input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .score{font-size:40px;font-weight:800;letter-spacing:-1px}
  .check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .check:last-child{border-bottom:none}
  .check .mk{flex:0 0 20px;font-weight:800}
  .ok{color:var(--green)}.no{color:var(--red)}.warn{color:var(--amber)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="login-card" onsubmit="doLogin(event)">
    <div class="brand-row">
      <div class="logo-badge">K</div>
      <div class="brand-name">KIMCHIP <span class="brand-x">× HEEDA</span></div>
    </div>
    <h1>Playbook 로그인</h1>
    <p class="sub">KIMCHIP US 런칭 전략 &amp; 성과 대시보드</p>
    <div class="field">
      <label>이메일</label>
      <input type="email" id="email" placeholder="you@kimchip.com" value="winter.a@kimchip.com" required />
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="pw" placeholder="••••••••" value="demo1234" required />
    </div>
    <button class="btn" type="submit">로그인</button>
    <div class="login-hint">데모 버전 · 아무 값이나 입력하면 로그인됩니다</div>
  </form>
</div>

<!-- APP -->
<div id="app">
  <div class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <div class="logo-badge">K</div>
        <div class="t">KIMCHIP<small>Playbook · HEEDA</small></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div class="avatar">W</div>
        <div>
          <div class="who">winter.a</div>
          <div class="role">agent</div>
        </div>
        <button class="logout" onclick="logout()">로그아웃</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <h2 id="topTitle">대시보드</h2>
        <span class="crumb" id="topCrumb">자사 브랜드</span>
        <div class="top-right">
          <span class="pill" id="rangePill">최근 30일</span>
          <span class="pill muted">USD</span>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<script>
/* ---------------- NAV CONFIG ---------------- */
const NAV = [
  {group:"자사 브랜드", items:[
    {id:"dashboard", ic:"▦", name:"대시보드"},
    {id:"amazon", ic:"🅰", name:"Amazon"},
    {id:"sp-ads", ic:"◈", name:"SP 광고"},
    {id:"sd-ads", ic:"◇", name:"SD 광고"},
    {id:"tiktok-ads", ic:"♪", name:"TikTok Ads"},
    {id:"meta-ads", ic:"ⓕ", name:"Meta Ads"},
    {id:"tiktok-utm", ic:"⛓", name:"TikTok UTM"},
    {id:"creatives", ic:"🎬", name:"광고 소재"},
    {id:"competitors", ic:"⚔", name:"경쟁사"},
    {id:"lmf", ic:"◎", name:"LMF"},
    {id:"outreach", ic:"✉", name:"아웃리치"},
    {id:"reel-checker", ic:"✔", name:"릴스 체커"},
    {id:"signal-planner", ic:"📡", name:"시그널플래너"},
    {id:"playbook", ic:"📘", name:"전략 가이드"},
    {id:"sop", ic:"📋", name:"SOP"},
    {id:"learnings", ic:"🧠", name:"학습 기록"},
    {id:"amazon-guide", ic:"📕", name:"광고 가이드"},
  ]},
  {group:"대행 클라이언트", items:[
    {id:"clients", ic:"🦆", name:"cosduck"},
  ]},
];
const TITLES = {};
NAV.forEach(g=>g.items.forEach(i=>TITLES[i.id]={name:i.name,group:g.group}));

/* ---------------- AUTH ---------------- */
function doLogin(e){e.preventDefault();document.getElementById('login').classList.add('hidden');
  document.getElementById('app').style.display='block';if(!location.hash)location.hash='#/dashboard';route();}
function logout(){document.getElementById('app').style.display='none';
  document.getElementById('login').classList.remove('hidden');}

/* ---------------- NAV RENDER ---------------- */
function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=NAV.map(g=>`
    <div class="nav-group">
      <div class="label">${g.group}</div>
      ${g.items.map(i=>`<a class="nav-item" data-id="${i.id}" href="#/${i.id}">
         <span class="ic">${i.ic}</span><span>${i.name}</span></a>`).join("")}
    </div>`).join("");
}

/* ---------------- HELPERS ---------------- */
const fmt=n=>n.toLocaleString('en-US');
const usd=n=>'$'+n.toLocaleString('en-US');
function kpi(label,val,delta,up){return `<div class="card kpi">
  <div class="k-label">${label}</div>
  <div class="k-val">${val}</div>
  <span class="delta ${up?'up':'down'}">${up?'▲':'▼'} ${delta}</span>
  <span class="k-label" style="margin-left:6px">전월 대비</span></div>`;}
let charts=[];
function clearCharts(){charts.forEach(c=>c.destroy());charts=[];}
const GRID={color:'#eef0f3'},TICK={color:'#9aa1ad',font:{size:11}};
function lineCfg(labels,datasets){return {type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:datasets.length>1,labels:{usePointStyle:true,boxWidth:8,font:{size:12}}}},
  scales:{x:{grid:{display:false},ticks:TICK},y:{grid:GRID,ticks:TICK,beginAtZero:true}},
  elements:{line:{tension:.35,borderWidth:2},point:{radius:0,hoverRadius:4}}}};}
function barCfg(labels,datasets){return {type:'bar',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,
  plugins:{legend:{display:datasets.length>1,labels:{usePointStyle:true,boxWidth:8,font:{size:12}}}},
  scales:{x:{grid:{display:false},ticks:TICK},y:{grid:GRID,ticks:TICK,beginAtZero:true}},
  borderRadius:6,maxBarThickness:34}};}
function doughCfg(labels,data,colors){return {type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},
  options:{responsive:true,maintainAspectRatio:false,cutout:'66%',plugins:{legend:{position:'right',labels:{usePointStyle:true,boxWidth:8,font:{size:12}}}}}};}
const days=Array.from({length:14},(_,i)=>`6/${15+i}`);
const months=['1월','2월','3월','4월','5월','6월'];
const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));
const series=(a,b,n=14)=>Array.from({length:n},()=>rnd(a,b));

/* 실시간 연동 헬퍼: /api/* 호출, 실패/데모 시 null 처리는 호출부에서 */
async function liveFetch(path){
  try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)return null;return await r.json();}
  catch(e){return null;}
}
function liveBadge(data){
  if(!data) return '<span class="tag a">오프라인</span>';
  if(data.demo) return '<span class="tag a">데모 데이터</span>';
  return '<span class="tag g">● 실시간 연동</span>';
}

/* ---------------- PAGES ---------------- */
const PAGES={};

PAGES.dashboard=()=>{
  return {html:`
    <div class="page-head"><h1>대시보드</h1><p>KIMCHIP US 런칭 전체 성과 요약 · 최근 30일</p></div>
    <div class="grid kpis" style="margin-bottom:16px">
      ${kpi('총 매출','$184,920','12.4%',true)}
      ${kpi('광고비 (Spend)','$52,310','3.1%',false)}
      ${kpi('블렌디드 ROAS','3.54x','8.2%',true)}
      ${kpi('전환수','2,418','15.7%',true)}
    </div>
    <div class="grid cols-2" style="margin-bottom:16px">
      <div class="card"><h3>매출 & 광고비 추이</h3><div class="csub">일별 · 최근 14일</div>
        <div class="chart-wrap"><canvas id="c-rev"></canvas></div></div>
      <div class="card"><h3>채널 매출 비중</h3><div class="csub">Amazon vs TikTok vs DTC</div>
        <div class="chart-wrap"><canvas id="c-mix"></canvas></div></div>
    </div>
    <div class="grid cols-2">
      <div class="card"><h3>채널별 성과</h3><div class="csub">최근 30일</div>
        <table><thead><tr><th>채널</th><th class="num">매출</th><th class="num">광고비</th><th class="num">ROAS</th><th>상태</th></tr></thead>
        <tbody>
          <tr><td>Amazon SP</td><td class="num">$72,400</td><td class="num">$21,100</td><td class="num">3.43x</td><td><span class="tag g">양호</span></td></tr>
          <tr><td>Amazon SD</td><td class="num">$28,900</td><td class="num">$9,800</td><td class="num">2.95x</td><td><span class="tag a">개선필요</span></td></tr>
          <tr><td>TikTok Ads</td><td class="num">$54,200</td><td class="num">$17,300</td><td class="num">3.13x</td><td><span class="tag g">양호</span></td></tr>
          <tr><td>DTC / Organic</td><td class="num">$29,420</td><td class="num">$4,110</td><td class="num">7.16x</td><td><span class="tag b">우수</span></td></tr>
        </tbody></table></div>
      <div class="card"><h3>오늘의 알림</h3><div class="csub">자동 시그널</div>
        <div class="list-row"><span class="tag r">긴급</span><span>SP 캠페인 "Kimchi Snack" ACOS 42%로 상승</span></div>
        <div class="list-row"><span class="tag a">주의</span><span>TikTok CR-0142 소재 CTR 1.2%로 하락</span></div>
        <div class="list-row"><span class="tag g">기회</span><span>"vegan kimchi" 키워드 검색량 +38%</span></div>
        <div class="list-row"><span class="tag b">정보</span><span>경쟁사 Mother In Law 신제품 런칭 감지</span></div>
        <div class="list-row"><span class="tag v">할일</span><span>주간 인플루언서 아웃리치 12건 대기</span></div>
      </div>
    </div>`,
    init(){
      charts.push(new Chart(document.getElementById('c-rev'),lineCfg(days,[
        {label:'매출',data:series(4000,9000),borderColor:'#e0392b',backgroundColor:'rgba(224,57,43,.08)',fill:true},
        {label:'광고비',data:series(1200,2600),borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.06)',fill:true}])));
      charts.push(new Chart(document.getElementById('c-mix'),doughCfg(['Amazon','TikTok','DTC'],[101300,54200,29420],['#e0392b','#111827','#d97706'])));
    }};
};

PAGES.amazon=()=>({html:`
  <div class="page-head"><h1>Amazon <span id="amzn-badge" class="tag a" style="vertical-align:middle">불러오는 중…</span></h1><p>아마존 셀러 센트럴 통합 성과</p></div>
  <div class="grid kpis" style="margin-bottom:16px" id="amzn-kpis">

/* ---------------- ROUTER ---------------- */
function route(){
  let id=(location.hash.replace('#/','')||'dashboard');
  if(!PAGES[id])id='dashboard';
  clearCharts();
  const page=PAGES[id]();
  document.getElementById('content').innerHTML=page.html;
  document.getElementById('topTitle').textContent=TITLES[id].name;
  document.getElementById('topCrumb').textContent=TITLES[id].group;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  window.scrollTo(0,0);
  if(page.init)setTimeout(()=>{try{page.init();}catch(e){console.warn(e);}},0);
}
window.addEventListener('hashchange',route);
buildNav();
</script>
</body>
</html>
